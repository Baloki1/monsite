# Fichier de configuration Render.com
# Render détecte automatiquement ce fichier et configure le service.
services:
  - type: web
    name: monsite
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
